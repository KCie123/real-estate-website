[images]
remote_images = [
  "^(?:http(?:s)?:\\/\\/static\\.wixstatic\\.com(?:\\/(?!\\.)(?:(?:(?!(?:^|\\/)\\.).)*?)|$))$"
]

[build]
command = "npm run build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[headers]]
for = "/_next/static/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/"
to = "/buy-or-sell"
status = 302

[[redirects]]
from = "/assets/vcards/ale.vcf"
to = "/assets/vcards/ale.vcf"
status = 200
force = true

  [redirects.headers]
  Content-Type = "text/vcard"
  Content-Disposition = "attachment; filename=\"ale.vcf\""

[[redirects]]
from = "/assets/vcards/buy.vcf"
to = "/assets/vcards/buy.vcf"
status = 200
force = true

  [redirects.headers]
  Content-Type = "text/vcard"
  Content-Disposition = "attachment; filename=\"buy.vcf\""

[[redirects]]
from = "/_next/image"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200

  [redirects.query]
  url = ":url"
  w = ":width"
  q = ":quality"

[[redirects]]
from = "/_ipx/*"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200

  [redirects.query]
  url = ":url"
  w = ":width"
  q = ":quality"

[context]

  [context.production]

    [context.production.images]
    remote_images = [
      "^(?:http(?:s)?:\\/\\/static\\.wixstatic\\.com(?:\\/(?!\\.)(?:(?:(?!(?:^|\\/)\\.).)*?)|$))$"
    ]

    [[context.production.headers]]
    for = "/_next/static/*"

      [context.production.headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

  [context.redesign]

    [context.redesign.images]
    remote_images = [
      "^(?:http(?:s)?:\\/\\/static\\.wixstatic\\.com(?:\\/(?!\\.)(?:(?:(?!(?:^|\\/)\\.).)*?)|$))$"
    ]

    [[context.redesign.headers]]
    for = "/_next/static/*"

      [context.redesign.headers.values]
      Cache-Control = "public, max-age=31536000, immutable"